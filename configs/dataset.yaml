# Gold export and document-level splits.
# Crops from one source document stay in one split.
#
# Label length counts every character the trainer keeps, including digits.
# Spaces are not counted. No label longer than 10 characters is written.
# At least 95% of labels are shorter than 5 characters. Any longer label
# is 8 to 10 characters.

label_length:
  max_characters: 10
  short_below: 5
  short_fraction: 0.95
  long_min_characters: 8

split:
  train: 0.8
  val: 0.1
  test: 0.1
  seed: 3407

export_formats:
  - provenance
  - simple

gold_statuses:
  - human_verified
  - human_corrected

diversity_warnings:
  department_share: 0.50
  document_share: 0.20
  partial_crop_ratio_low: 0.05
  partial_crop_ratio_high: 0.90

# Every fail switch stays on. The loader rejects a config that turns one off.
quality_gate:
  fail_on_document_leakage: true
  fail_on_parent_line_leakage: true
  fail_on_invalid_unicode: true
  fail_on_missing_images: true
  fail_on_missing_labels: true
  fail_on_duplicate_sample_ids: true
  fail_on_conflicting_gold_labels: true
  fail_on_unverified_candidates: true
  fail_on_rejected_samples: true
  fail_on_missing_provenance: true
