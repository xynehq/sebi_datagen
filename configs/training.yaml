# PARSeq fine-tuning. The orchestrator reads this together with configs/pipeline.yaml.
# Leave base_checkpoint empty to start from the published language base.
# Set it here, in configs/local.yaml, or with CHECKPOINT to start from another file.

backend: parseq
primary_metric: cer
epochs: 1
batch_size: 8
learning_rate: 0.0001
device: auto
base_checkpoint: ""
seed: 3407
# Unset steps means epochs × batches. Validation runs at 30% and 70% of
# those steps, then once more in the evaluation stage after training.
steps:
val_checks: 10
